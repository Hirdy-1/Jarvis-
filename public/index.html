 <!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <title>Jarvis Web</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-black text-white">
  <div id="app" class="min-h-screen flex">
    <!-- Left panel -->
    <aside class="w-1/4 border-r border-gray-800 p-4">
      <h2 class="text-xl font-semibold mb-4">Quick Actions</h2>
      <button id="btn-open-app" class="w-full mb-2 bg-blue-600 py-2 rounded">Open App</button>
      <button id="btn-send-msg" class="w-full mb-2 bg-green-600 py-2 rounded">Send Message</button>
      <button id="btn-run-routine" class="w-full mb-2 bg-purple-600 py-2 rounded">Run Routine</button>
    </aside>

    <!-- Center -->
    <main class="flex-1 p-4 flex flex-col">
      <header class="flex justify-between items-center mb-4">
        <div>
          <h1 class="text-2xl font-bold">Jarvis Command Centre</h1>
          <p id="user-label" class="text-gray-400 text-sm">Not signed in</p>
        </div>
        <button id="btn-logout" class="bg-red-600 px-3 py-1 rounded text-sm">Logout</button>
      </header>

      <section id="logs" class="flex-1 bg-gray-900 rounded-lg p-4 mb-4 overflow-y-auto">
        <!-- command + response logs -->
      </section>

      <section class="flex gap-2">
        <input
          id="command-input"
          class="flex-1 bg-gray-800 rounded px-3 py-2"
          placeholder="Speak to Jarvis..."
        />
        <button
          id="btn-send-command"
          class="bg-blue-600 px-4 py-2 rounded font-semibold"
        >
          Send
        </button>
      </section>
    </main>

    <!-- Right panel -->
    <aside class="w-1/4 border-l border-gray-800 p-4">
      <h2 class="text-xl font-semibold mb-4">Memory</h2>
      <textarea
        id="memory-input"
        class="w-full h-24 bg-gray-800 rounded px-3 py-2 mb-2"
        placeholder="Add something to Jarvis's memory..."
      ></textarea>
      <button id="btn-save-memory" class="w-full bg-yellow-600 py-2 rounded mb-4">
        Save Memory
      </button>
      <div id="memory-list" class="space-y-2 text-sm">
        <!-- memory items -->
      </div>
    </aside>
  </div>

  <!-- Scripts -->
  <script type="module" src="/src/ui.js"></script>
</body>
</html>
